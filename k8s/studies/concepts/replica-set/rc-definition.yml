apiVersion: v1
kind: ReplicationController # The old way to create replicas on K8s
metadata:
  name: myapp-rc
  labels:
    app: myapp
    type: front-end

spec:
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
        tier: frontend
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          limits:
            memory: 128Mi
            cpu: "1"
  replicas: 3

