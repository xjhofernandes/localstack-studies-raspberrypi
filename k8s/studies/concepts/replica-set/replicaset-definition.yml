apiVersion: apps/v1
kind: ReplicaSet # The new way to create replicas on K8s

metadata:
  name: myapp-replicaset
  labels:
    app: myapp
    tier: front-end

spec:
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
        tier: front-end
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          limits:
            memory: 128Mi
            cpu: "1"

  replicas: 3
  selector: # Selector is the way to match the pods to the ReplicaSet
    matchLabels:
      tier: front-end
